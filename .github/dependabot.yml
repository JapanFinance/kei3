version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    open-pull-requests-limit: 10
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # The Lighthouse engine and its Chrome launcher move together; an engine
      # bump can legitimately shift scores, and its PR validates itself against
      # the Lighthouse gate (see lighthouse-budget.js).
      lighthouse:
        patterns:
          - 'lighthouse'
          - 'chrome-launcher'
      mui:
        patterns:
          - '@mui*'
      # oxlint and oxfmt are published from the oxc monorepo on a single weekly
      # release, always within minutes of each other, on separate version lines.
      # oxlint-tsgolint follows the TypeScript Go compiler instead, so it is not
      # part of this group.
      oxc:
        patterns:
          - 'oxlint'
          - 'oxfmt'
      react:
        patterns:
          - 'react'
          - 'react-dom'
